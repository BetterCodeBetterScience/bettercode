name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev

      - name: Install dependencies
        run: |
          uv pip install --system -e .

      - name: Run tests
        run: |
          pytest --cov=src/bettercode --cov-report=term-missing --cov-report=xml

      - name: Generate coverage badge
        run: |
          uv pip install --system genbadge[coverage]
          mkdir -p .github/badges
          genbadge coverage -i coverage.xml -o .github/badges/coverage.svg

      - name: Commit badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/badges/coverage.svg
          git diff --staged --quiet || git commit -m "Update coverage badge"
          git push
