# Regenerate the Quarto HTML book from the LaTeX source and deploy to GitHub Pages.
# The LaTeX under latex/ is the source of truth; web/ is generated by scripts/tex2qmd
# and is not committed. This workflow rebuilds it from scratch on every push.
name: Deploy Quarto book

on:
  push:
    branches: [main, latex-integration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # poppler-utils provides pdftocairo (PDF figures -> SVG);
      # pandoc is called directly by scripts/tex2qmd (not via Quarto's bundled copy).
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils pandoc

      - uses: astral-sh/setup-uv@v5

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python deps
        run: uv sync

      - name: Regenerate listing outputs
        run: uv run python scripts/build_listings.py verify testing

      - name: Convert LaTeX to Quarto
        run: uv run python scripts/tex2qmd/convert.py --latex-dir latex --out web

      - name: Render Quarto book
        run: cd web && quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
